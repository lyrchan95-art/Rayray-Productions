<title>Idea2Proto Live</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Noto+Sans+TC:wght@400;500;800&display=swap">
<style>
/* Layout: one-thumb mobile app; capture → spec → workspace (chat + full-screen preview) → journal. Desktop splits chat | preview. */
/* Head designer: exactly three tones. Tone 1 jade (tiled-wall green), tone 2 vermilion (enamel-sign red), neutral newsprint paper; ink is the paper's own dark. Every other colour below is a mix of these. */
:root{
  --tone1:#0c6a56;--tone2:#c13a24;--paper:#eeece5;--ink:#1c1b18;
  --bg:var(--paper);--fg:var(--ink);
  --surface:color-mix(in srgb,var(--paper) 45%,#fff);--surface-2:color-mix(in srgb,var(--paper) 90%,var(--ink));--surface-3:color-mix(in srgb,var(--paper) 80%,var(--ink));
  --muted:color-mix(in srgb,var(--ink) 78%,var(--paper));--faint:color-mix(in srgb,var(--ink) 68%,var(--paper));--border:color-mix(in srgb,var(--paper) 82%,var(--ink));
  --accent:var(--tone1);--accent-strong:color-mix(in srgb,var(--tone1) 78%,var(--ink));--accent-soft:color-mix(in srgb,var(--tone1) 11%,var(--paper));--on-accent:var(--paper);
  --danger:color-mix(in srgb,var(--tone2) 86%,var(--ink));--bubble:var(--surface-2);--scrim:rgba(28,27,24,.45);
  --serif:"Source Serif 4","Noto Serif TC","Songti TC",Georgia,serif;--sans:Inter,"Noto Sans TC","PingFang HK",system-ui,sans-serif;--head:"Noto Sans TC","PingFang HK",Inter,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace;
  --r-sm:3px;--r-md:4px;--r-lg:6px;--r-xl:8px;--shadow:none;
  --lift:5px 7px 22px rgba(28,27,24,.16);--ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tone1:#52c2a4;--tone2:#ef7a65;--paper:#1b1a17;--ink:#ece9e1;--surface:color-mix(in srgb,var(--paper) 90%,var(--ink));--surface-2:color-mix(in srgb,var(--paper) 84%,var(--ink));--surface-3:color-mix(in srgb,var(--paper) 74%,var(--ink));--muted:color-mix(in srgb,var(--ink) 82%,var(--paper));--faint:color-mix(in srgb,var(--ink) 72%,var(--paper));--border:color-mix(in srgb,var(--paper) 78%,var(--ink));--accent-strong:color-mix(in srgb,var(--tone1) 80%,var(--ink));--accent-soft:color-mix(in srgb,var(--tone1) 14%,var(--paper));--danger:var(--tone2);--scrim:rgba(0,0,0,.6);--lift:5px 7px 22px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--tone1:#52c2a4;--tone2:#ef7a65;--paper:#1b1a17;--ink:#ece9e1;--surface:color-mix(in srgb,var(--paper) 90%,var(--ink));--surface-2:color-mix(in srgb,var(--paper) 84%,var(--ink));--surface-3:color-mix(in srgb,var(--paper) 74%,var(--ink));--muted:color-mix(in srgb,var(--ink) 82%,var(--paper));--faint:color-mix(in srgb,var(--ink) 72%,var(--paper));--border:color-mix(in srgb,var(--paper) 78%,var(--ink));--accent-strong:color-mix(in srgb,var(--tone1) 80%,var(--ink));--accent-soft:color-mix(in srgb,var(--tone1) 14%,var(--paper));--danger:var(--tone2);--scrim:rgba(0,0,0,.6);--lift:5px 7px 22px rgba(0,0,0,.45);color-scheme:dark}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.app{height:100%;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}
.top{display:flex;align-items:center;gap:8px;min-height:52px;padding-block:4px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--serif);font-weight:600;font-size:19px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.brand b{color:var(--accent);font-weight:600}
.main{flex:1;min-height:0;overflow-y:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav{display:flex;border-top:1px solid var(--border);background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;min-height:56px;border:0;background:none;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);font-weight:500;font-size:14px;transition:background .12s var(--ease)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{background:none;border-color:transparent}
.btn.block{width:100%}.btn.lg{min-height:52px;font-size:15px;border-radius:var(--r-lg)}
.ib{width:44px;height:44px;border:0;background:none;border-radius:var(--r-md);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ib:hover{background:var(--surface-2);color:var(--fg)}
.ib.sm{width:34px;height:34px}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button{border:0;background:none;min-height:34px;padding:0 10px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.input,.ta{width:100%;min-height:44px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);font-size:16px}
.input:focus,.ta:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:none;line-height:1.5}
.label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);font-size:13px;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-strong)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:var(--r-sm);background:var(--accent-soft);color:var(--accent-strong);font-weight:500}

/* capture */
.capture{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-block:20px 28px}
.hero{text-align:center;margin:auto 0 28px}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(30px,8vw,38px);line-height:1.15;margin:0 0 6px;text-wrap:balance;letter-spacing:-.015em}
.hero p{margin:0;color:var(--muted)}
.voice{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
.mic{position:relative;width:112px;height:112px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);box-shadow:0 2px 12px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;transition:transform .12s var(--ease),background .12s var(--ease)}
.mic svg{width:44px;height:44px;stroke-width:1.6}
.mic:active{transform:scale(.96)}
.mic[data-state="listening"]{background:var(--danger)}
.mic[data-state="listening"]::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--danger);animation:pulse 1.2s var(--ease) infinite}
.mic:disabled{background:var(--surface-3);color:var(--faint);cursor:default}
@keyframes pulse{from{transform:scale(.9);opacity:.6}to{transform:scale(1.15);opacity:0}}
.hint{font-size:14px;color:var(--muted);min-height:1.5em;text-align:center;max-width:36ch}
.alt{display:flex;gap:8px;align-items:flex-end}
.alt .ta{min-height:52px;max-height:40vh;border-radius:var(--r-lg)}
.send{width:52px;height:52px;flex-shrink:0;border:0;border-radius:var(--r-lg);background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.send:disabled{background:var(--surface-3);color:var(--faint);cursor:default}
.examples{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;justify-content:center}
.examples button{font-size:13px}
.spec h2{font-family:var(--serif);font-weight:400;font-size:26px;margin:0 0 4px}

/* workspace */
.ws{display:flex;height:100%;min-height:0}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.scroll{flex:1;min-height:0;overflow-y:auto}
.col{max-width:720px;margin:0 auto;padding-block:12px 20px}
.summary{margin-bottom:20px}
.summary p{font-family:var(--serif);font-size:17px;margin:8px 0 0}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:10px 0 0;font-size:13px}
.summary dt{color:var(--faint)}.summary dd{margin:0}
.msg{margin-bottom:22px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--bubble);padding:10px 14px;border-radius:16px 16px 6px 16px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.prose{font-family:var(--serif);font-size:17px;line-height:1.65;word-wrap:break-word}
.prose p{margin:0 0 10px}.prose p:last-child{margin:0}
.prose code{font-family:var(--mono);font-size:.88em;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.route{font-size:12px;color:var(--faint);display:flex;align-items:center;gap:6px;margin-bottom:4px}
.route svg{width:14px;height:14px}
.acts{display:flex;gap:2px;margin-top:4px}
.acts svg{width:16px;height:16px}
.acard{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:12px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);text-align:left;font-size:14px}
.acard:hover{border-color:var(--accent)}
.acard .ico{width:44px;height:44px;border-radius:var(--r-md);background:var(--accent-soft);color:var(--accent-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.dots{display:inline-flex;gap:4px;padding:8px 0}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.prog{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}
.composer-wrap{padding-block:0 12px}
.composer{max-width:720px;margin:0 auto;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:8px 8px 8px 12px}
.composer:focus-within{box-shadow:var(--shadow),0 0 0 3px var(--accent-soft)}
.composer textarea{display:block;width:100%;border:0;background:none;resize:none;outline:none;padding:8px 4px;max-height:30vh;font-size:16px}
.crow{display:flex;align-items:center;gap:4px}
.model{flex:1;min-width:0;font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.sbtn{width:38px;height:38px;border:0;border-radius:var(--r-md);background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;justify-content:center}
.sbtn:disabled{background:var(--surface-3);color:var(--faint);cursor:default}
.preview{display:flex;flex-direction:column;background:var(--surface)}
@media (max-width:899px){.preview{position:fixed;inset:0;z-index:50;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:rise .18s var(--ease)}}
@media (min-width:900px){.preview{width:min(46vw,560px);flex-shrink:0;border-left:1px solid var(--border)}}
@keyframes rise{from{transform:translateY(24px);opacity:0}}
.pbar{display:flex;align-items:center;gap:4px;min-height:52px;padding:0 8px;border-bottom:1px solid var(--border);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.pbar .t{flex:1;min-width:0;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
.pbar select{min-height:34px;border-radius:var(--r-md);border:1px solid var(--border);background:var(--surface);padding:0 6px;font-size:13px}
.stage{flex:1;min-height:0;display:flex;justify-content:center;background:var(--surface-2)}
.stage iframe{flex:1;width:100%;border:0;background:#fff;display:block}
@media (min-width:900px){.stage{padding:16px}.stage iframe{max-width:430px;border-radius:var(--r-lg);box-shadow:0 2px 10px rgba(0,0,0,.1)}}

/* journal */
.journal{max-width:720px;margin:0 auto;padding-block:8px 28px}
.journal h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:4px 0 14px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.entry{display:block;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-lg);border:1px solid var(--border);background:var(--surface);margin-bottom:8px}
.entry:hover{border-color:var(--faint)}
.entry b{display:block;font-weight:600}
.entry span.sub{display:block;font-size:13px;color:var(--muted);margin:2px 0 8px}
.meta{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--faint);flex-wrap:wrap}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.group{font-size:12px;color:var(--faint);font-weight:500;margin:16px 0 6px}

/* sheet + toast */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim)}
.sheet{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--surface);border-radius:var(--r-xl) var(--r-xl) 0 0;padding-block:8px calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:rise .18s var(--ease)}
.sheet h2{font-size:20px;margin:4px 0 14px}
.handle{width:36px;height:4px;border-radius:99px;background:var(--surface-3);margin:4px auto 10px}
@media (min-width:640px){.sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(480px,92vw);transform:translate(-50%,-50%);border-radius:var(--r-xl);animation:none}.handle{display:none}}
.toast{position:fixed;z-index:80;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:var(--r-sm);font-size:14px;max-width:calc(100vw - 32px)}
.note{font-size:12px;color:var(--faint);text-align:center;margin-top:10px}

/* skills + agents + suggestions */
.lib{max-width:720px;margin:0 auto;padding-block:8px 28px}
.lib h1{font-family:var(--serif);font-weight:400;font-size:28px;margin:4px 0 6px}
.list .acard{margin:0 0 8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;margin:0}
.kv dt{color:var(--faint)}.kv dd{margin:0}
.slist{margin:0 0 16px;padding-left:22px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.sug-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:18px;font-size:13px}
.examples .chip{border-radius:16px;text-align:left;padding:8px 12px;line-height:1.35;gap:8px;font-size:13px}
.examples .chip svg{width:16px;height:16px;flex-shrink:0}
.skillbanner{display:flex;align-items:center;justify-content:center;gap:4px;margin:-12px 0 16px}
.steps{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);padding:12px 14px}
.step[data-s="running"]{border-color:var(--accent)}
.step h3{margin:0;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.step .out{margin-top:8px}
.step .out.prose{font-size:15px;line-height:1.6}
.mark{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:var(--surface-3);color:var(--muted);flex-shrink:0}
.mark svg{width:13px;height:13px;stroke-width:2.6}
.mark.run{background:var(--accent-soft)}
.mark.done{background:var(--accent);color:var(--on-accent)}
.mark.err{background:var(--danger);color:var(--on-accent)}
.pd{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.runact{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.error{color:var(--danger)}

/* skill packs, quality gate, tips */
.prow{display:flex;align-items:center;gap:8px;cursor:default}
.rowmain{flex:1;min-width:0;display:flex;gap:12px;align-items:center;background:none;border:0;text-align:left;padding:0}
.switch{position:relative;width:46px;height:28px;flex-shrink:0;border-radius:var(--r-sm);border:0;background:var(--surface-3);transition:background .12s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s var(--ease)}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(18px)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--border);margin-top:14px}
pre.src{white-space:pre-wrap;font:12px/1.5 var(--mono);background:var(--surface-2);border-radius:var(--r-md);padding:12px;max-height:40vh;overflow:auto;margin:8px 0 0}
.swatches,.chips{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.stages{list-style:none;display:flex;gap:8px;padding:0;margin:8px 0 0;flex-wrap:wrap;font-family:var(--sans);font-size:13px}
.stages li{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:var(--r-sm);border:1px solid var(--border);color:var(--faint)}
.stages li i{font-style:normal;font-weight:700}
.stages li[data-s="running"]{border-color:var(--accent);color:var(--accent-strong)}
.stages li[data-s="done"]{color:var(--muted)}
.quality{margin-top:10px;border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface);font-family:var(--sans);font-size:14px}
.quality summary{display:flex;align-items:center;gap:8px;padding:6px 12px;cursor:pointer;list-style:none;min-height:44px;flex-wrap:wrap}
.quality summary::-webkit-details-marker{display:none}
.quality>*:not(summary){margin:0 12px 12px}
.qscore{min-width:40px;height:28px;padding:0 8px;border-radius:var(--r-sm);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;background:var(--surface-3)}
.qscore[data-tone="good"]{background:var(--accent-soft);color:var(--accent-strong)}
.qscore[data-tone="low"]{background:var(--danger);color:var(--on-accent)}
.qt{font-weight:600}
.chks{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 10px;border-radius:var(--r-sm);border:1px solid var(--border);color:var(--muted)}
.chk i{font-style:normal;font-weight:700}
.chk[data-s="pass"] i{color:var(--accent)}
.chk[data-s="warn"] i{color:var(--fg)}
.chk[data-s="fail"]{border-color:var(--danger)}
.chk[data-s="fail"] i{color:var(--danger)}
.issues{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.iss{display:flex;flex-direction:column;gap:2px;padding-left:12px;border-left:3px solid var(--border)}
.iss[data-sev="high"]{border-left-color:var(--danger)}
.iss[data-sev="medium"]{border-left-color:var(--faint)}
.plain{margin:0;padding-left:18px}
.qact{display:flex;gap:8px;flex-wrap:wrap}

function agentPrompt(def, it, note, prior, cur) {
  const skill = cur?.skill || it.spec.suggestedSkill;
  const plain = def.kind === "build" ? "" : '\nPlain text only: no markdown headings; short lines; use "- " for lists; **bold** is allowed.';
  const ins = def.kind === "build" ? `${def.ins}\n${designPrompt(skill, it)}` : def.ins;
  const ctx = [
    `IDEA: ${JSON.stringify(it.spec)}`,
    it.raw ? `ORIGINAL WORDS: ${it.raw}` : "",
    note ? `FOUNDER'S EXTRA INSTRUCTIONS: ${note}` : "",
    ...prior.map((p) => `PREVIOUS STEP, ${p.title}:\n${p.text.slice(0, 2500)}`),
  ];
  if (def.needsHtml) {
    const html = def.after ? it.versions.at(-1)?.html : cur?.html;
    if (html) ctx.push(`${def.after ? "NEW" : "CURRENT"} PROTOTYPE:\n\`\`\`html\n${html.slice(0, 14000)}\n\`\`\``);
  }
  return `[Instructions]\n${ins}\n${REGISTER[S.register]}${plain}\n[/Instructions]\n\n${ctx.filter(Boolean).join("\n\n")}`;
}

let runAbort = null;
async function runAgent(agent, ideaId, note) {
  const it = S.ideas.find((i) => i.id === ideaId); if (!it) return;
  if (S.run?.status === "running") return toast(t("agentBusy"));
  const sample = await sampler();
  if (!sample) return toast(t("noModel"));
  S.run = { agentId: agent.id, ideaId, note, status: "running", steps: agent.steps.map((d) => ({ key: d.key, title: d.title, status: "pending", text: "", versionN: null })) };
  S.sheet = null; renderSheet(); S.view = "run"; render();
  runAbort = new AbortController();
  const done = [];
  for (let i = 0; i < agent.steps.length; i++) {
    const def = agent.steps[i], st = S.run.steps[i];
    st.status = "running"; renderRunBody();
    try {
      const cur = it.versions.find((v) => v.n === it.currentVersion);
      const res = await askDurable("a_" + ideaId, agentPrompt(def, it, note, done, cur), {
        signal: runAbort.signal, tier: def.tier || "default",
        onText: (text) => { st.text = def.kind === "build" ? text.split(/```|<!doctype|<html/i)[0] : text; renderRunBody(); },
      });
      let text = res.text || st.text;
      if (def.kind === "build") {
        const { note: lead, html } = extract(text);
        if (!html) throw new Error(lang() ? "No prototype came back." : "冇生成到原型。");
        const bsk = cur?.skill || it.spec.suggestedSkill;
        const g = { html, q: buildQ({ it, skill: bsk, checks: autoChecks(await measureHtml(html, it.id), staticChecks(html)), review: null, deep: false }) };
        const n = (it.versions.at(-1)?.n || 0) + 1;
        it.versions.push({ n, html: g.html, q: g.q, skill: cur?.skill || it.spec.suggestedSkill, note: lead.slice(0, 300), createdAt: Date.now() });
        it.currentVersion = n; st.versionN = n; text = lead || "✓";
      }
      st.text = text.trim(); st.status = "done";
      done.push({ title: def.title[lang()], text: st.text });
      if (runAbort?.signal.aborted) { S.run.status = "stopped"; break; }
    } catch (e) {
      if (runAbort?.signal.aborted) { st.status = "pending"; S.run.status = "stopped"; }
      else { st.status = "error"; st.text = modelError(e); S.run.status = "error"; }
      break;
    }
    renderRunBody();
  }
  if (S.run.status === "running") S.run.status = "done";
  const ok = S.run.steps.filter((x) => x.status === "done");
  if (ok.length) {
    const L = lang();
    it.messages.push({ role: "user", content: agent.name[L] + (note ? "：" + note : ""), skill: "agent:" + agent.id });
    it.messages.push({ role: "assistant", content: ok.map((x) => `**${x.title[L]}**\n${x.text}`).join("\n\n"), skill: "agent:" + agent.id, versionN: [...ok].reverse().find((x) => x.versionN)?.versionN || null, feedback: 0 });
    it.updatedAt = Date.now();
  }
  S.runLog.unshift({ agentId: agent.id, ideaId, title: it.spec.title, at: Date.now(), status: S.run.status });
  S.runLog = S.runLog.slice(0, 8); LS.set("i2p.runs", S.runLog);
  persist(); runAbort = null; render();
}

  chat:[[/\?\s*$|？\s*$/,1.6],[/^(what|how|why|should|can you explain|is it|is there|do you|does|which|who|when|where)\b/i,1.8],[/\b(explain|advice|recommend|compare|pros and cons|market|pricing|competitors?|thoughts on|opinion)\b/i,1.4],[/(點解|點樣|係咪|有冇|咩|嗎|建議|意見|比較|市場|定價|對手|你覺得)/,1.6]],
};
const sc = (rs, x) => rs.reduce((s, [re, w]) => (re.test(x) ? s + w : s), 0);
function route(text, artifactSkill) {
  const s = {"game-prototype":sc(R.game,text),"design-variants":sc(R.variants,text),"prototype-html":sc(R.html,text),chat:sc(R.chat,text)};
  const tw = sc(R.tweak, text);
  if (artifactSkill && tw > 0) s[artifactSkill] += tw + 1;
  if (s["game-prototype"] >= 3) s["prototype-html"] *= .5;
  if (s["design-variants"] >= 2.5) s["prototype-html"] *= .6;
  const e = Object.entries(s).sort((a, b) => b[1] - a[1]);
  const tot = e.reduce((a, [, v]) => a + v, 0);
  if (!e[0][1]) return { skill: "chat", confidence: .3 };
  const conf = Math.round((.6 * e[0][1] / tot + .4 * Math.min(1, e[0][1] / 3)) * 100) / 100;
  return conf < .55 ? { skill: "chat", confidence: conf } : { skill: e[0][0], confidence: conf };
}

const RULES = `Output rules (strict):
- First, 1–2 short sentences to the user about what you built or changed. No headings, no lists.

  "prototype-html": "You are a senior product designer-engineer. Build a working, clickable, mobile-first prototype of the idea as one HTML file. Make the core interaction actually work with realistic sample data. Polished, modern, generous spacing, one accent colour.",
  "game-prototype": "You are a mobile game prototyper. Build a playable PORTRAIT game on a full-screen <canvas>. Pointer events for touch (tap/drag) that work with one thumb, also mouse. touch-action:none, devicePixelRatio, resize, requestAnimationFrame. Start screen → play → game over with score and tap-to-restart; best score in localStorage. Gentle difficulty ramp, light juicy feedback.",
  "design-variants": "You are a brand and UI art director. Produce THREE or FOUR distinctly different visual directions for the SAME key screen, as horizontally swipeable full-screen panels (CSS scroll-snap, each 100vw). Each panel labelled 'n/N · direction name'. Directions must differ in palette, type, radius, density and imagery style — not just colour swaps.",
};
const specBlock = (sp) => `<spec>${JSON.stringify(sp)}</spec>`;

function buildMessages(skill, it, input, currentHtml, messages = it.messages) {
  const hist = [];
  let budget = 12000;
  for (let i = messages.length - 1; i >= 0 && hist.length < 12; i--) {
    const m = messages[i];
    const c = m.versionN ? `${m.content}\n[produced prototype v${m.versionN}]` : m.content;
    if ((budget -= c.length) < 0) break;
    hist.unshift({ role: m.role, content: c });
  }
  while (hist.length && hist[0].role !== "user") hist.shift();
  const sys = skill === "chat"
    ? `You are a sharp, warm product thinking partner for indie founders in Hong Kong. Be concise and concrete; short paragraphs; give opinions when asked. If they seem to want something built, suggest they say so.\n${REGISTER[S.register]}\nThe idea: ${specBlock(it.spec)}`
    : designPrompt(skill, it, { exemplar: !currentHtml });
  const iter = currentHtml ? `\n\nCURRENT PROTOTYPE (modify it — keep everything not asked to change, return the full updated document):\n\`\`\`html\n${currentHtml}\n\`\`\`` : "";
  const msgs = [...hist, { role: "user", content: input + iter }];
  // System instructions ride in the first user turn (memoryless sampler).
  msgs[0] = { role: "user", content: `[Instructions]\n${sys}\n[/Instructions]\n\n${msgs[0].content}` };
  return msgs;
}

function extract(reply) {
  const f = reply.match(/```(?:html)?\s*\n([\s\S]*?)(?:\n```|$)/i);
  let html = null, note = reply;
  if (f && /<(html|body|!doctype|canvas|div|section)/i.test(f[1])) { html = f[1].trim(); note = reply.slice(0, f.index).trim(); }
  else { const r = reply.match(/<!doctype html[\s\S]*?(<\/html>|$)/i); if (r) { html = r[0]; note = reply.slice(0, r.index).trim(); } }
  if (html) {
    if (!/<!doctype/i.test(html)) html = "<!doctype html>\n" + html;
    const o = (html.match(/<script\b/gi) || []).length, c = (html.match(/<\/script>/gi) || []).length;
    if (o > c) html += "\n<\/script>";
    if (!/<\/body>/i.test(html)) html += "\n</body>";
    if (!/<\/html>/i.test(html)) html += "\n</html>";
  }
  return { note, html };
}

function ok(s){try{window[s].setItem('__t','1');window[s].removeItem('__t');return true}catch(e){return false}}

if(!ok('sessionStorage'))try{Object.defineProperty(window,'sessionStorage',{configurable:true,value:mk({})})}catch(e){}})();<\/script>`;

function wrap(html, seed) {
  const head = SHIM.replace("__SEED__", JSON.stringify(seed || {}).replace(/</g, "\\u003c")) + FILL;

}

function createIdea(generate = true) {   // generate: true = build now, false = save only, "deep" = open Idea Studio
  const now = Date.now();

/* ───────── durable jobs: survive a locked screen, a dropped connection and a reload ───────── */
// Every in-flight generation is written down (input, partial output, per-screen progress) so nothing is lost when the
// phone locks. Same page: it resumes by itself when you return, at most twice, and only when YOUR device was hidden
// (a plain service error is left for you to retry, as the platform asks). After a reload: one tap on "Resume".
const TUNE = Object.assign({ awayStream: 6000, graceStream: 10000, awayJson: 15000, graceJson: 25000, stuck: 75000 }, LS.get("i2p.tune", {}));
const JOBS = LS.get("i2p.jobs", {});               // id -> job (persisted)
const LIVE = {}, ACTIVE = new Set(); let askSeq = 0, saveTimer = 0;   // LIVE: calls in flight; ACTIVE: jobs whose runner is executing
const H = { hiddenAt: 0 };
const saveJobs = () => LS.set("i2p.jobs", JOBS);
const jobPut = (j) => { JOBS[j.id] = j; saveJobs(); return j; };
const jobDel = (id) => { delete JOBS[id]; saveJobs(); };
const jobSaveSoon = () => { if (!saveTimer) saveTimer = setTimeout(() => { saveTimer = 0; saveJobs(); }, 1500); };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
for (const j of Object.values(JOBS)) { j.status = "interrupted"; j.hiddenDuring = false; if (!findIdea(j.ideaId)) delete JOBS[j.id]; }   // a fresh page has nothing running, and never calls the model on its own: one tap resumes

/** Keep the screen on while anything is generating; browsers release the lock when hidden, so re-take it on return. */
const awake = {
  n: 0, lock: null, ok: false,
  on() { this.n++; return this.get(); },
  off() { this.n = Math.max(0, this.n - 1); if (!this.n) this.release(); },
  async get() {
    if (this.lock || !this.n || document.hidden || !navigator.wakeLock) return;
    try { const l = await navigator.wakeLock.request("screen"); this.lock = l; this.ok = true; l.addEventListener?.("release", () => { this.lock = null; this.ok = false; }); } catch (e) { this.ok = false; }
  },
  release() { try { this.lock?.release(); } catch (e) {} this.lock = null; this.ok = false; },
};

/** One model call with durability. Resolves like sample(); rejects with {kind: user | stalled | upstream | fatal, text} so callers know WHY it ended. */
async function ask(jobId, input, { tier = "default", json = false, onText, signal } = {}) {
  const sample = await sampler();
  if (!sample || (json && !sample.json)) throw { kind: "fatal", code: "not_granted", text: "" };
  const ctl = new AbortController(), key = "h" + ++askSeq;
  const h = (LIVE[key] = { jobId, ctl, lastProgress: Date.now(), streams: !!onText, stalled: false, user: false });
  if (signal) { if (signal.aborted) h.user = true, ctl.abort(); else signal.addEventListener("abort", () => { h.user = true; ctl.abort(); }); }
  awake.on(); let acc = "";
  try {
    const opts = { signal: ctl.signal, cache: false, modelTier: tier, ...(onText ? { onText: ({ text }) => { acc = text; h.lastProgress = Date.now(); onText(text); } } : {}) };
    return json ? await sample.json(input, opts) : await sample(input, opts);
  } catch (e) {
    const text = e?.text || acc || "";
    if (h.stalled) throw { kind: "stalled", text };
    if (h.user || (e?.code === "cancelled" && !h.stalled)) throw { kind: "user", text };
    if (!e?.code || e.code === "upstream_error") throw { kind: "upstream", text, code: e?.code };
    throw { kind: "fatal", code: e.code, message: e.message, text };
  } finally { delete LIVE[key]; awake.off(); }
}
/** Short calls (Studio, research): after a lock, wait for the viewer to return and retry in place instead of silently falling back to a template. */
async function askDurable(jobId, input, opts, maxTries = 3) {
  for (let i = 1; ; i++) {
    try { return await ask(jobId, input, opts); }
    catch (e) {
      if (!(e.kind === "stalled" || (e.kind === "upstream" && JOBS[jobId]?.hiddenDuring)) || i >= maxTries) throw e;
      if (JOBS[jobId]) { JOBS[jobId].attempts = i + 1; saveJobs(); }
      while (document.hidden) await sleep(400);
      await sleep(600);
    }
  }
}
function cancelJob(id) {
  const job = JOBS[id]; if (!job) return; job.cancelled = true;

}
// A call that never answers after the phone woke up is declared stalled, so the job can continue from what it has.
setInterval(() => {
  const now = Date.now();
  for (const h of Object.values(LIVE)) {
    if (!h.returnedAt || h.stalled || h.user) continue;
    const since = now - h.returnedAt;
    if (h.streams ? h.away >= TUNE.awayStream && since >= TUNE.graceStream && h.lastProgress < h.returnedAt : h.away >= TUNE.awayJson && since >= TUNE.graceJson) { h.stalled = true; h.ctl.abort(); }
  }
}, 1000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) {
    H.hiddenAt = Date.now();
    for (const id of ACTIVE) if (JOBS[id]) JOBS[id].hiddenDuring = true;
    saveJobs(); persist();
  } else {
    const away = Date.now() - H.hiddenAt; awake.get();
    for (const h of Object.values(LIVE)) { h.returnedAt = Date.now(); h.away = away; }
    setTimeout(() => { for (const j of Object.values(JOBS)) if (j.status === "interrupted" && j.hiddenDuring && j.attempts < 3 && !ACTIVE.has(j.id) && (j.kind === "turn" || j.kind === "build")) resumeJob(j.id); }, 600);
  }
});
window.addEventListener("pagehide", () => { saveJobs(); persist(); });

function buildingJob(ideaId, n) { return Object.values(JOBS).find((j) => j.kind === "build" && j.ideaId === ideaId && j.versionN === n && ACTIVE.has(j.id)); }
function buildProgress(job) {
  const it = findIdea(job.ideaId), v = it?.versions.find((x) => x.n === job.versionN), parts = v?.build?.parts || {};
  return { d: (job.ids || []).filter((i) => parts[i]?.status === "done").length, n: (job.ids || []).length };
}
function noticeHtml() {
  return Object.values(JOBS).filter((j) => j.status === "interrupted" && !ACTIVE.has(j.id) && (j.kind === "turn" || j.kind === "build") && findIdea(j.ideaId) && !(S.pending && S.pending.jobId === j.id)).map((j) => {
    const it = findIdea(j.ideaId), pr = j.kind === "build" ? t("jobProg_build").replace("{d}", buildProgress(j).d).replace("{n}", buildProgress(j).n) : t("jobProg_turn").replace("{k}", ((j.partial || "").length / 1000).toFixed(1));
    return `<div class="notice" role="status"><span><b>${t("jobBar").replace("{t}", esc(it.spec.title))}</b><br><span class="faint">${pr}</span></span><span class="nbtns"><button class="btn primary" data-act="resume-job" data-id="${j.id}">${t("jobResume")}</button><button class="btn ghost" data-act="drop-job" data-id="${j.id}">${t("jobDrop")}</button></span></div>`;

}
function resumeJob(id) {
  const job = JOBS[id]; if (!job || ACTIVE.has(id)) return;
  const it = findIdea(job.ideaId); if (!it) return jobDel(id);
  if (S.pending && S.pending.jobId !== id) return toast(t("agentBusy"));
  job.status = "running"; saveJobs();
  if (job.kind === "turn" || job.kind === "build") { S.ideaId = it.id; S.view = "idea"; openPending(job); render(); scrollEnd(); return job.kind === "build" ? runBuildJob(id) : runTurnJob(id); }
  S.ideaId = it.id; S.view = "studio"; render();
  return job.kind === "groom" ? runGrooming(it.id, { forced: job.forced, only: job.only }) : runResearch(it.id);

/* ───────── turns ───────── */
const CONTINUE = "Your previous reply was cut off because the connection dropped. Continue EXACTLY from the last character you wrote. Output ONLY the remaining characters: no code fence, nothing already written repeated, no commentary. Finish the document.";

function openPending(job) {

    log: job.skill !== "chat" ? { phase: "wait", iterating: job.baseN != null, brief: briefLine(it, job.skill), skills: skillsLine(job.skill) } : null };
  if (job.partial) trackProgress(S.pending, job.partial);

}

async function turn({ input, forceSkill, regenerate, editIndex, fresh }) {
  const it = idea(); if (!it || S.pending) return;
  if (!(await sampler())) return toast(t("noModel"));
  if (regenerate) {
    const i = it.messages.map((m) => m.role).lastIndexOf("user");
    if (i < 0) return;
    input = it.messages[i].content; forceSkill = it.messages[i].skill; it.messages = it.messages.slice(0, i);
    if (String(forceSkill).startsWith("agent:")) forceSkill = undefined;
  } else if (editIndex != null) it.messages = it.messages.slice(0, editIndex);

  const cur = it.versions.find((v) => v.n === it.currentVersion);
  const r = forceSkill ? { skill: forceSkill, confidence: 1 } : route(input, cur?.skill);
  const skill = r.skill;
  const iterating = !fresh && skill !== "chat" && cur && cur.skill === skill && cur.html;
  const ids = skill === "prototype-html" && it.blueprint ? activeScreens(it.blueprint).map((x) => x.id) : [];
  const staged = ids.length >= 3 && (!iterating || !!regenerate);          // blueprint products are built shell-first, screen by screen
  const cut = it.messages.length;
  it.messages.push({ role: "user", content: input, skill });
  const job = jobPut({ id: "j" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), kind: staged ? "build" : "turn", ideaId: it.id, skill, input, cut, baseN: iterating && !staged ? cur.n : null,
    conf: r.confidence, deepCheck: !!regenerate || !(cur && cur.skill === skill && cur.q), ids: staged ? ids : [], status: "running", attempts: 0, partial: "", startedAt: Date.now(), hiddenDuring: false });

}

async function runTurnJob(id) {
  const job = JOBS[id], it = job && findIdea(job.ideaId); if (!it) return jobDel(id);
  if (ACTIVE.has(id)) return; ACTIVE.add(id);
  job.status = "running"; job.attempts++; job.cancelled = false; job.hiddenDuring = document.hidden; saveJobs();
  const pend = S.pending && S.pending.jobId === id ? S.pending : openPending(job);
  pend.waiting = false;
  const base = job.baseN != null ? it.versions.find((v) => v.n === job.baseN) : null;
  const msgs0 = buildMessages(job.skill, it, job.input, base?.html || null, it.messages.slice(0, job.cut));
  const resumeFrom = job.skill !== "chat" && job.partial && job.partial.length > 1500 && /<!doctype|<html|```html/i.test(job.partial) ? job.partial : "";
  const msgs = resumeFrom ? [...msgs0, { role: "assistant", content: resumeFrom }, { role: "user", content: CONTINUE }] : msgs0;

  let acc = resumeFrom;

    const res = await ask(id, msgs, { tier: job.skill === "chat" ? "quick" : "default", onText: (text) => {
      acc = resumeFrom ? stitch(resumeFrom, text) : text; job.partial = acc; jobSaveSoon();
      if (S.pending?.jobId === id) { trackProgress(S.pending, acc); renderPending(true); }
    } });
    finishTurn(job, it, resumeFrom ? stitch(resumeFrom, res.text) : res.text, res.truncated);
  } catch (e) { job.partial = acc || job.partial || ""; ACTIVE.delete(id); handleJobError(job, e); }   // inactive first, so the redraw can offer "Resume"
  finally { ACTIVE.delete(id); }
}

function finishTurn(job, it, full, truncated) {
  const skill = job.skill; let content = full.trim(), versionN = null, outSkill = skill, kick = null;
  if (skill !== "chat") {
    const { note, html } = extract(full);
    if (html) {
      versionN = (it.versions.at(-1)?.n || 0) + 1;
      it.versions.push({ n: versionN, html, q: null, skill, screens: job.ids || [], note: note.slice(0, 300), createdAt: Date.now() });
      if (S.gate) kick = { n: versionN, deep: job.deepCheck };
      it.currentVersion = versionN; S.viewN = versionN; S.previewOpen = true;
      content = note || "✓";
      if (truncated) toast(lang() ? "Output was cut short; it may be incomplete. Try “regenerate”." : "輸出被截短，可能唔完整。可以試下重新生成。");
    } else outSkill = "chat";
  }
  it.messages.push({ role: "assistant", content, skill: outSkill, versionN, feedback: 0 });
  if (kick) runCheck(it.id, kick.n, { deep: kick.deep, allowFix: true });   // not awaited: the output is already on screen
  it.updatedAt = Date.now(); jobDel(job.id); closePending(); persist(); render(); scrollEnd();
}

function handleJobError(job, e) {
  const it = findIdea(job.ideaId);
  if (!it) { jobDel(job.id); closePending(); return; }
  if (e?.kind === "user" || job.cancelled) {                               // Stop was pressed
    if (job.kind === "build" && job.versionN != null) return finalizeBuild(job, it, it.versions.find((x) => x.n === job.versionN), { stopped: true });
    if (job.skill === "chat" && (job.partial || "").trim()) it.messages.push({ role: "assistant", content: job.partial.trim(), skill: "chat", feedback: 0 });

  }

        <dl><dt>${t("core")}</dt><dd>${esc(it.spec.coreInteraction)}</dd><dt>${t("user")}</dt><dd>${esc(it.spec.targetUser)}</dd></dl></section>
      <div id="msgs">${it.messages.map((m, i) => msgHtml(m, i, it, lastA)).join("")}${pendingHtml()}</div>
    </div></div>
    <div class="composer-wrap"><form class="composer" id="cform"><label class="sr" for="draft">${t("message")}</label>
      <textarea id="draft" rows="1" placeholder="${esc(S.listening ? S.partial || t("listening") : t("message"))}">${esc(S.draft)}</textarea>
      <div class="crow"><span class="model">${esc(modelLabel)}</span>
        <button type="button" class="ib sm" id="mic" aria-label="Voice" aria-pressed="${S.listening}" ${S.pending ? "disabled" : ""} style="${S.listening ? "color:var(--danger)" : ""}">${svg(S.listening ? "stop" : "mic")}</button>
        ${S.pending ? `<button type="button" class="sbtn" data-act="stop" aria-label="Stop">${svg("stop")}</button>` : `<button type="submit" class="sbtn" aria-label="Send" ${S.draft.trim() ? "" : "disabled"}>${svg("send")}</button>`}
      </div></form></div></div>${preview}</div>`;
}

function viewJournal() {
  const q = S.q.trim().toLowerCase();
  const list = S.ideas.filter((i) => (!S.filter || i.spec.suggestedSkill === S.filter) &&
    (!q || [i.spec.title, i.spec.oneLiner, i.raw, ...i.messages.map((m) => m.content)].join(" ").toLowerCase().includes(q)));
  const d0 = new Date(); d0.setHours(0, 0, 0, 0); const day = 864e5;
  const groups = [[t("today"), []], [t("yesterday"), []], [t("week"), []], [t("older"), []]];
  list.forEach((i) => groups[i.updatedAt >= +d0 ? 0 : i.updatedAt >= d0 - day ? 1 : i.updatedAt >= d0 - 7 * day ? 2 : 3][1].push(i));
  const fmt = new Intl.DateTimeFormat(lang() ? "en-HK" : "zh-HK", { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
  return `<div class="journal"><h1>${t("journal")}</h1>
    <label class="sr" for="jq">${t("search")}</label><input class="input" id="jq" type="search" placeholder="${t("search")}" value="${esc(S.q)}">
    <div class="filters" role="group" aria-label="Filter">${["", "prototype-html", "game-prototype", "design-variants"].map((f) => `<button class="chip" data-filter="${f}" aria-pressed="${S.filter === f}">${f ? skillIcon(f) + " " + sl(f) : t("all")}</button>`).join("")}</div>
    ${list.length ? groups.filter((g) => g[1].length).map(([label, items]) => `<h2 class="group">${label}</h2>` + items.map((i) => `<button class="entry" data-open-idea="${i.id}"><b>${esc(i.spec.title)}</b><span class="sub">${esc(i.spec.oneLiner)}</span>
      <span class="meta"><span class="tag">${sl(i.spec.suggestedSkill)}</span>${i.currentVersion ? `<span>v${i.currentVersion}</span>` : ""}<span>${i.messages.length} ${lang() ? "messages" : "則訊息"}</span><span>${fmt.format(i.updatedAt)}</span></span></button>`).join("")).join("")
      : `<p class="empty">${S.ideas.length ? t("nomatch") : t("none")}</p>`}</div>`;
}

function render() {
  const inIdea = S.view === "idea", focus = inIdea || S.view === "studio";
  const it = idea();
  document.documentElement.lang = S.register === "en" ? "en" : "zh-HK";
  const top = inIdea
    ? `<div class="top"><button class="ib" data-nav="journal" aria-label="${t("journal")}">${svg("back")}</button><span class="brand" style="font-size:16px">${esc(it?.spec.title || "")}</span>
       ${it?.currentVersion ? `<button class="ib" data-act="toggle-preview" aria-label="Preview" aria-pressed="${S.previewOpen}">${svg("play")}</button>` : ""}
       <button class="ib" data-act="open-studio" aria-label="${t("stOpen")}" title="${t("stOpen")}">${svg("layers")}</button>
       <button class="ib" data-act="del" aria-label="${t("del")}" style="${S.confirmDel ? "color:var(--danger)" : ""}" title="${S.confirmDel ? t("confirmDel") : t("del")}">${svg("trash")}</button></div>`
    : S.view === "studio"
    ? `<div class="top"><button class="ib" data-nav="journal" aria-label="${t("journal")}">${svg("back")}</button><span class="brand" style="font-size:16px">${esc(it?.spec.title || "")}</span>${it?.versions.length ? `<button class="btn ghost" data-act="to-idea">${t("stToWork")}</button>` : ""}</div>`
    : S.view === "run" && S.run
    ? `<div class="top"><button class="ib" data-nav="agents" aria-label="${t("navAgents")}">${svg("back")}</button><span class="brand" style="font-size:16px">${AGENTS.find((a) => a.id === S.run.agentId).name[lang()]}</span>${S.run.status === "running" ? `<button class="btn" data-act="stop-run">${t("stopRun")}</button>` : ""}</div>`
    : `<div class="top"><span class="brand">Idea2Proto<b>.</b></span>${regSeg()}</div>`;
  const body = noticeHtml() + ({ capture: viewCapture, skills: viewSkills, agents: viewAgents, run: viewRun, journal: viewJournal, idea: viewIdea, studio: viewStudio })[S.view]();
  const cur = S.view === "run" ? "agents" : S.view;
  const navBtn = (v, icon, label) => `<button data-nav="${v}" aria-current="${cur === v ? "page" : "false"}">${svg(icon)}${label}</button>`;
  const nav = focus ? "" : `<nav class="nav" aria-label="Main">${navBtn("capture", "plus", t("newIdea"))}${navBtn("skills", "grid", t("navSkills"))}${navBtn("agents", "bot", t("navAgents"))}${navBtn("journal", "book", t("journal"))}</nav>`;
  const focusId = document.activeElement?.id, selStart = document.activeElement?.selectionStart;
  $app.classList.toggle("hasnav", !focus);
  const keepScroll = lastView === S.view ? ($app.querySelector(".main")?.scrollTop || 0) : 0; lastView = S.view;
  $app.innerHTML = top + `<main class="main" style="${inIdea ? "padding:0;overflow:hidden;display:flex;flex-direction:column" : ""}">${body}</main>` + nav;
  if (keepScroll) $app.querySelector(".main").scrollTop = keepScroll;
  if (inIdea) { const ws = $app.querySelector(".ws"); if (ws) ws.style.flex = "1"; const sc = $app.querySelector(".chat"); sc.querySelectorAll(".col,.composer-wrap").forEach((e) => { e.style.paddingLeft = "max(16px, env(safe-area-inset-left,0px))"; e.style.paddingRight = "max(16px, env(safe-area-inset-right,0px))"; }); }
  const fr = document.getElementById("pframe");
  if (fr && it) { const v = it.versions.find((x) => x.n === (S.viewN ?? it.currentVersion)); fr.srcdoc = wrap(resolveAssets(v.html, it.id), it.store); }
  const ta = document.getElementById("draft"); if (ta) autosize(ta);
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.focus(); try { if (selStart != null) el.setSelectionRange(selStart, selStart); } catch {} } }
}

/* ───────── events (delegated) ───────── */
const onClick = async (e) => {
  if (e.target.classList?.contains("scrim")) { S.sheet = null; return renderSheet(); }
  const b = e.target.closest("button"); if (!b) return;
  if (b.id !== "mic" && b.dataset.act !== "del") S.confirmDel = false;
  if (b.dataset.reg) { S.register = b.dataset.reg; LS.set("i2p.register", S.register); return render(); }
  if (b.dataset.nav) { if (S.listening) dict?.stop().catch(() => {}); S.view = b.dataset.nav; S.previewOpen = false; S.editing = null; S.draft = ""; S.sheet = null; renderSheet(); if (S.view === "capture") { S.skillPick = null; S.modeLock = false; } return render(); }
  if (b.dataset.ex) { S.draft = b.dataset.ex; return structure(S.draft); }
  if (b.dataset.mode) { S.mode = b.dataset.mode; return render(); }
  if (b.dataset.arch) {
    const it = idea(); if (!it?.blueprint || GROOM[it.id] || b.dataset.arch === it.blueprint.archetype) return;
    if (S.archPending !== b.dataset.arch) { S.archPending = b.dataset.arch; return render(); }
    S.archPending = null; return runGrooming(it.id, { forced: b.dataset.arch });
  }
  if (b.dataset.dec) {
    const it = idea(), bp = it.blueprint, d = bp.decisions.find((x) => x.id === b.dataset.dec);
    const before = activeScreens(bp).map((x) => x.id); d.chosen = +b.dataset.opt;
    S.flash = activeScreens(bp).map((x) => x.id).filter((x) => !before.includes(x));
    it.updatedAt = Date.now(); persist(); render(); setTimeout(() => { S.flash = []; }, 1200); return;
  }
  if (b.dataset.pair) { const it = idea(); it.style.pairing = b.dataset.pair; loadFonts(b.dataset.pair); persist(); return render(); }
  if (b.dataset.stone) {
    const it = idea(), [n, id] = b.dataset.stone.split(":"), x = TONES.find((y) => y.id === id);
    const hex = ensureContrast(x.hex, it.style.paper, 4.5, it.style.ink);
    it.style["tone" + n] = { name: lang() ? x.en : x.zh, hex }; if (n === "1") it.style.adjusted = hex !== x.hex; persist(); return render();
  }
  if (b.dataset.sopt) { const it = idea(), [k, v] = b.dataset.sopt.split(":"); it.style[k] = v; persist(); return render(); }
  if (b.dataset.packToggle) {
    const id = b.dataset.packToggle, p = PACKS.find((x) => x.id === id);
    if (p.kind === "workflow") { S.gate = !S.gate; LS.set("i2p.gate", S.gate); } else { S.craft[id] = !packOn(id); LS.set("i2p.craft", S.craft); }
    if (S.sheet) renderSheet();
    return render();
  }
  if (b.dataset.tone) { const st = S.spec.style, i = st.tones.indexOf(b.dataset.tone); if (i >= 0) st.tones.splice(i, 1); else { st.tones.push(b.dataset.tone); if (st.tones.length > 2) st.tones.shift(); } return render(); }
  if (b.dataset.phil) { S.spec.style.phil = b.dataset.phil; return render(); }
  if (b.dataset.skillOpen) { S.sheet = { kind: "skill", id: b.dataset.skillOpen }; return renderSheet(); }
  if (b.dataset.agentOpen) { S.sheet = { kind: "agent", id: b.dataset.agentOpen, ideaId: S.ideas.some((i) => i.id === S.ideaId) ? S.ideaId : S.ideas[0]?.id, note: "" }; return renderSheet(); }
  if (b.dataset.skillUse) { S.skillPick = b.dataset.skillUse; S.sheet = null; renderSheet(); S.view = "capture"; S.sug = pickSuggestions(S.skillPick); render(); return document.getElementById("draft")?.focus(); }
  if (b.dataset.sheetEx) { S.skillPick = b.dataset.for; S.sheet = null; renderSheet(); S.view = "capture"; S.draft = b.dataset.sheetEx; S.sug = pickSuggestions(S.skillPick); render(); return structure(S.draft); }
  if (b.dataset.agentRun) return runAgent(AGENTS.find((a) => a.id === b.dataset.agentRun), document.getElementById("agent-idea")?.value, (document.getElementById("agent-note")?.value || "").trim());
  if (b.dataset.skill) { S.spec.suggestedSkill = b.dataset.skill; return render(); }
  if (b.dataset.filter != null) { S.filter = b.dataset.filter; return render(); }
  if (b.dataset.openIdea) { S.ideaId = b.dataset.openIdea; S.view = (() => { const x = idea(); return x && !x.versions.length && x.blueprint ? "studio" : "idea"; })(); S.viewN = null; S.previewOpen = matchMedia("(min-width:900px)").matches && !!idea()?.currentVersion; render(); return scrollEnd(); }
  if (b.id === "mic") return toggleMic();
  if (b.id === "gen") return S.spec.title.trim() && createIdea(S.skillPick === "idea-capture" ? false : S.mode === "deep" ? "deep" : true);
  if (b.id === "reset") { S.spec = null; S.draft = ""; return render(); }
  const it = idea(); const i = +b.dataset.i;
  switch (b.dataset.act) {
    case "use-version": { const nn = +b.dataset.n; it.currentVersion = nn; S.viewN = nn; S.previewOpen = true; it.updatedAt = Date.now(); persist(); return render(); }
    case "stop-check": CHK[chkKey(S.ideaId, +b.dataset.n)]?.ctl.abort(); return;
    case "reaudit": return reauditVersion(+b.dataset.n, { fix: false });
    case "autofix": return reauditVersion(+b.dataset.n, { fix: true });
    case "audit-current": {
      const cur = idea(); if (!cur?.currentVersion) return toast(t("noProto"));
      S.sheet = null; renderSheet(); S.view = "idea"; render(); return reauditVersion(cur.currentVersion, { fix: false });
    }
    case "tip-asset": S.assetSlot = b.dataset.slot; document.getElementById("assetfile").click(); return;
    case "tip-decide": {
      const v = it.versions.find((x) => x.n === +b.dataset.n), tp = v.q.tips[+b.dataset.i], opt = tp.options[+b.dataset.j];
      tp.done = opt; persist(); render();
      return turn({ input: lang() ? `Decision on "${tp.title}": ${opt}. Apply it.` : `「${tp.title}」我揀：${opt}。按呢個改。`, forceSkill: v.skill });
    }
    case "tip-content": {
      const v = it.versions.find((x) => x.n === +b.dataset.n), tp = v.q.tips[+b.dataset.i];
      S.draft = `${tp.title}：`; render(); const d = document.getElementById("draft"); d?.focus(); d?.setSelectionRange(d.value.length, d.value.length); return;
    }
    case "asset-remove": { const l = S.assets[S.ideaId] || []; const k = l.findIndex((a) => a.id === b.dataset.id); if (k >= 0) l.splice(k, 1); LS.set("i2p.assets", S.assets); return render(); }
    case "groom": return runGrooming(S.ideaId);
    case "research-run": return runResearch(S.ideaId);
    case "research-open": {
      S.sheet = null; renderSheet();
      const x = idea() || S.ideas[0]; if (!x) { toast(t("mrNoIdea")); S.view = "capture"; S.mode = "deep"; S.modeLock = true; return render(); }
      S.ideaId = x.id; S.view = "studio"; S.mrOpen = true; return render();
    }
    case "copy-text": try { await navigator.clipboard.writeText(b.dataset.text); toast(t("copied")); } catch {} return;
    case "reroll-style": return runGrooming(S.ideaId, { only: "style" });
    case "build-bp": return buildFromBlueprint();
    case "open-studio": S.view = "studio"; S.previewOpen = false; S.archPending = null; return render();
    case "to-idea": S.view = "idea"; return render();
    case "studio-new": S.sheet = null; renderSheet(); S.mode = "deep"; S.modeLock = true; S.skillPick = null; S.view = "capture"; return render();
    case "sheet-close": S.sheet = null; return renderSheet();
    case "sug-refresh": S.sug = pickSuggestions(S.skillPick); return render();
    case "skill-clear": S.skillPick = null; S.sug = pickSuggestions(); return render();
    case "run-view": S.view = "run"; return render();
    case "stop-run": runAbort?.abort(); return;
    case "copy-run": { const L = lang(); try { await navigator.clipboard.writeText(S.run.steps.filter((x) => x.status === "done").map((x) => x.title[L] + "\n" + x.text).join("\n\n")); toast(t("copied")); } catch {} return; }
    case "rerun": return runAgent(AGENTS.find((a) => a.id === S.run.agentId), S.run.ideaId, S.run.note);
    case "launch-page": {
      const copy = S.run.steps.find((x) => x.key === "copy")?.text; S.ideaId = S.run.ideaId; S.view = "idea"; S.viewN = null; S.previewOpen = false; render();
      return turn({ input: (lang() ? "Build a landing page using this exact copy:\n" : "用呢段文案整個落地頁，字眼照用：\n") + copy, forceSkill: "prototype-html" });
    }
    case "open": S.viewN = +b.dataset.n; S.previewOpen = true; return render();
    case "close": S.previewOpen = false; return render();
    case "toggle-preview": S.previewOpen = !S.previewOpen; S.viewN = null; return render();
    case "revert": it.currentVersion = +b.dataset.n; it.updatedAt = Date.now(); persist(); toast(`${t("version")} ${b.dataset.n} ✓`); return render();
    case "dl": return downloadHtml(it.versions.find((v) => v.n === +b.dataset.n), it);
    case "copy": try { await navigator.clipboard.writeText(it.messages[i].content); toast(t("copied")); } catch {} return;
    case "fb": { const m = it.messages[i], v = +b.dataset.v; m.feedback = m.feedback === v ? 0 : v; persist(); return render(); }
    case "regen": return turn({ regenerate: true });
    case "edit": S.editing = i; render(); return document.getElementById("edit")?.focus();
    case "edit-cancel": S.editing = null; return render();
    case "edit-save": { const v = document.getElementById("edit").value.trim(); if (!v) return; S.editing = null; return turn({ input: v, editIndex: +b.dataset.i }); }
    case "stop": cancelJob(S.pending?.jobId); return;
    case "resume-job": return resumeJob(b.dataset.id);
    case "drop-job": { const j = JOBS[b.dataset.id]; if (j?.kind === "build" && j.versionN != null) { const x = findIdea(j.ideaId); if (x) finalizeBuild(j, x, x.versions.find((q) => q.n === j.versionN), { stopped: true }); } jobDel(b.dataset.id); return render(); }
    case "kick-job": { const j = JOBS[b.dataset.id]; if (j) { j.hiddenDuring = true; for (const h of Object.values(LIVE)) if (h.jobId === j.id) { h.stalled = true; h.ctl.abort(); } } return; }
    case "retry-screens": return retryScreens(+b.dataset.n);
    case "del":
      if (!S.confirmDel) { S.confirmDel = true; toast(t("confirmDel")); return render(); }
      S.ideas = S.ideas.filter((x) => x.id !== S.ideaId); delete S.assets[S.ideaId]; LS.set("i2p.assets", S.assets); persist(); S.confirmDel = false; S.view = "journal"; return render();
  }
};
$app.addEventListener("click", onClick);
document.getElementById("sheet").addEventListener("click", onClick);
document.getElementById("assetfile").addEventListener("change", async (e) => {
  const f = e.target.files?.[0]; e.target.value = "";
  const it = idea(); if (!f || !it) return;
  const a = await addAsset(it.id, f, S.assetSlot || "photo"); if (!a) return;
  if (S.view === "studio") { toast(t("assetSaved")); return render(); }
  toast(t("assetUsed")); render();
  const cur = it.versions.find((v) => v.n === it.currentVersion);
  turn({ input: lang() ? `Use the uploaded ${slotName(a.slot)} (asset:${a.id}) where it fits best.` : `將我上傳嘅${slotName(a.slot)}（asset:${a.id}）用落最啱嘅位置。`, forceSkill: cur?.skill || it.spec.suggestedSkill });
});
$app.addEventListener("input", (e) => {
  const el = e.target;
  if (el.id === "draft") { S.draft = el.value; autosize(el); const s = $app.querySelector('.sbtn[type="submit"]'); if (s) s.disabled = !S.draft.trim(); }
  if (el.dataset.spec) S.spec[el.dataset.spec] = el.value;
  if (el.dataset.bp) {
    const it = idea(); if (!it?.blueprint) return;
    setPath(it.blueprint, el.dataset.bp, el.value); it.updatedAt = Date.now(); persist();
    const st = document.getElementById("mr-stale"); if (st && it.research) st.hidden = it.research.basedOn === researchKey(it);
    const rd = readiness(it.blueprint, it), a = document.getElementById("rd"), l = document.getElementById("rd-line");
    if (a) a.innerHTML = rdHtml(rd); if (l) l.textContent = rdLine(rd);
  }
  if (el.id === "jq") { S.q = el.value; render(); }
});
$app.addEventListener("change", (e) => { if (e.target.id === "ver") { S.viewN = +e.target.value; render(); } });
$app.addEventListener("keydown", (e) => {
  if (e.target.id === "draft" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); e.target.form?.requestSubmit(); }
});
$app.addEventListener("submit", (e) => {
  e.preventDefault();
  const v = S.draft.trim(); if (v.length < 2) return;
  if (e.target.id === "capform") structure(v);
  if (e.target.id === "cform") { S.draft = ""; turn({ input: v }); }
});
document.addEventListener("toggle", (e) => { if (e.target.id === "mr") S.mrOpen = e.target.open; }, true);
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (S.sheet) { S.sheet = null; renderSheet(); } else if (S.previewOpen) { S.previewOpen = false; render(); } });

render();
})();
</script>
